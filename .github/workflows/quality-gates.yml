name: quality-gates

# Repository quality gates. Runs on every push and pull request.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gates:
    name: Repository quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --max-warnings=0 .
